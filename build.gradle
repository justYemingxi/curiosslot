plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.24'
}

version = '1.4.1'
group = 'com.curiosslot'

base {
    archivesName = 'curiosslot'
}

// NeoForge 1.21.1 需要 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// 强制 UTF-8，避免中文注释/字符串在 GBK 环境下乱码
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Curios 的 ISlotHelper/CuriosApi 大量 API 被 @Deprecated(forRemoval=true) 标记，
    // 但这些是 1.21.1 的正式接口，必须使用；关闭 removal 告警以免被当作编译错误。
    options.compilerArgs += '-Xlint:-removal'
}

// ModDevGradle：版本声明后自动提供 neoforge 依赖与官方映射
neoForge {
    version = '21.1.263'
}

repositories {
    // Curios 官方 maven（编译依赖）
    maven {
        url = 'https://maven.theillusivec4.top/'
    }
}

dependencies {
    // Curios API：编译依赖（运行时由玩家装 Curios 提供）。
    // 使用本地 NeoForge 版 jar（maven.theillusivec4.top 上该坐标拉不到，jar 随仓库分发供 CI 编译）。
    compileOnly files('libs/curios-neoforge-9.5.1+1.21.1.jar')
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "curiosslot",
                "Specification-Version"   : "1",
                "Implementation-Title"    : "curiosslot",
                "Implementation-Version"  : project.jar.archiveVersion,
        ])
    }
}
