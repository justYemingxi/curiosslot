name: Build NeoForge 1.21.1

on:
  push:
    branches: [ "neoforge-1.21.1" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build NeoForge jar
        run: |
          echo "=== NeoGradle plugin marker metadata ==="
          curl -sS -m 30 https://maven.neoforged.net/releases/net/neoforged/gradle/net.neoforged.gradle.gradle.plugin/maven-metadata.xml || true
          echo ""
          echo "=== neoforge dependency metadata (head) ==="
          curl -sS -m 30 https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | head -60 || true
          echo "=== gradle build ==="
          ./gradlew clean build -x test --no-daemon --console=plain

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: curiosslot-neoforge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
